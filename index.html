<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SETKA PRO — управление турнирами</title>
<style>
:root{--bg:#0b0d10;--panel:#14181e;--panel2:#1b2129;--line:#2a333e;--text:#eef2f6;--muted:#9aa6b2;--red:#d62839;--green:#2eb67d;--amber:#e6a23c;--blue:#5596e6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 30% -20%,#222b36 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#101419ed;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.12em}.mark{width:38px;height:38px;background:var(--red);display:grid;place-items:center;font-size:21px;font-weight:1000;clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.28em}.topright{display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 66px)}aside{border-right:1px solid var(--line);padding:18px 12px;background:#101419}.nav{width:100%;text-align:left;padding:11px 13px;margin:3px 0;background:transparent;border:1px solid transparent;color:var(--muted);border-radius:7px;font-weight:700}.nav:hover,.nav.active{background:var(--panel2);border-color:var(--line);color:white}.nav.active{border-left:3px solid var(--red)}.nav .ico{display:inline-block;width:25px;color:var(--red)}.sidefoot{margin:28px 8px;color:#73808d;font-size:11px;line-height:1.7}.main{padding:28px;max-width:1600px;width:100%;margin:auto}.eyebrow{color:var(--red);font-weight:900;letter-spacing:.2em;font-size:10px;text-transform:uppercase}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}.heading h1{font-size:30px;margin:4px 0 0;letter-spacing:-.03em}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:6px;font-weight:750}.btn:hover{border-color:#647487}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.good{background:#173b30;border-color:#28654f}.btn.danger{color:#ff7884;border-color:#74313a}.btn.small{padding:5px 9px;font-size:12px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.card{background:linear-gradient(145deg,var(--panel),#11151a);border:1px solid var(--line);border-radius:10px}.stat{padding:17px}.stat b{display:block;font-size:29px;margin-top:4px}.stat span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.card{padding:18px;margin-bottom:15px}.card h3{margin:0 0 14px;font-size:15px}.cols{grid-template-columns:1.2fr .8fr}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}td{font-size:13px}.tag{display:inline-block;padding:3px 7px;border-radius:4px;background:#27313c;color:#c7d2dc;font-size:10px;font-weight:800}.tag.red{background:#461e25;color:#ff8993}.tag.green{background:#163c30;color:#77e0b3}.tag.amber{background:#46351d;color:#ffd18a}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.field input,.field select,.field textarea,.search{width:100%;background:#0d1116;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:6px;outline:none}.field input:focus,.field select:focus{border-color:var(--red)}.field textarea{min-height:80px}.actions{display:flex;gap:6px;justify-content:flex-end}.empty{text-align:center;padding:35px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.search{max-width:300px}.bracket{display:flex;gap:22px;overflow:auto;padding:10px 0 22px}.round{min-width:220px;display:flex;flex-direction:column;gap:14px}.round h4{color:var(--muted);font-size:11px;letter-spacing:.13em}.match{border:1px solid var(--line);background:#10151b;border-radius:7px;padding:9px}.competitor{display:flex;justify-content:space-between;padding:7px 5px;border-bottom:1px solid #252e38}.competitor:last-child{border:0}.winner{color:#74dfad;font-weight:900}.modalback{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:16px}.modal{background:#171d24;border:1px solid #394553;border-radius:10px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 25px 80px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.toast{position:fixed;bottom:20px;right:20px;background:#203b31;border:1px solid #39775d;padding:12px 16px;border-radius:7px;z-index:30}.hint{color:#aab6c2;background:#1b242d;padding:12px;border-left:3px solid var(--blue);border-radius:4px;font-size:12px}.pill{border:1px solid var(--line);border-radius:20px;padding:4px 9px;color:var(--muted);font-size:11px}.hidden{display:none!important}.login{max-width:460px;margin:12vh auto;padding:28px}.login h1{font-size:28px}.footer{color:#65717d;text-align:center;font-size:10px;padding:20px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav{white-space:nowrap;width:auto}.sidefoot{display:none}.main{padding:17px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr 1fr}.top{padding:0 14px}}@media(max-width:520px){.formgrid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.brand{font-size:13px}.topright .rolelabel{display:none}}
</style></head><body><div id="app"></div><div id="modalroot"></div><script>
'use strict';
const KEY='setka-pro-v1';const $=s=>document.querySelector(s);const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateNow=()=>new Date().toISOString().slice(0,10);
const roles=[['SUPER_ADMIN','Суперадминистратор'],['ADMIN','Администратор'],['ORGANIZER','Организатор'],['SECRETARY','Секретарь'],['WEIGH_IN_OPERATOR','Взвешивание'],['CHIEF_JUDGE','Главный судья'],['JUDGE','Судья'],['VIEWER','Наблюдатель']];
let db={athletes:[],clubs:[],tournaments:[],registrations:[],weighins:[],categories:[],brackets:[],matches:[],settings:{federation:'Не задана',rulesNote:'Официальный регламент не загружен'},user:{name:'Организатор',role:'ADMIN'}};let page='home',activeTournament=null,searchTerm='';
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)db={...db,...x}}catch(e){console.warn(e)}}function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(s){let n=document.createElement('div');n.className='toast';n.textContent=s;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function can(...r){return r.includes(db.user.role)||['SUPER_ADMIN','ADMIN'].includes(db.user.role)}
function go(p){page=p;searchTerm='';render()}
function header(){return `<header class="top"><div class="brand"><div class="mark">S</div><div>SETKA PRO<small>ARM WRESTLING TOURNAMENT SYSTEM</small></div></div><div class="topright"><span class="pill rolelabel">${esc(roles.find(x=>x[0]===db.user.role)?.[1]||db.user.role)}</span><select class="btn" onchange="changeRole(this.value)" aria-label="Роль">${roles.map(r=>`<option value="${r[0]}" ${db.user.role===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select><button class="btn small" onclick="exportAll()">Экспорт</button></div></header>`}
const nav=[['home','⌂','Обзор'],['tournaments','▣','Турниры'],['athletes','♟','Спортсмены'],['clubs','⚑','Клубы'],['registration','☷','Регистрация'],['weighin','⚖','Взвешивание'],['categories','▤','Категории'],['brackets','⌘','Сетки и результаты'],['settings','⚙','Настройки / импорт']];
function render(){let body=page==='home'?home():page==='tournaments'?tournaments():page==='athletes'?athletes():page==='clubs'?clubs():page==='registration'?registration():page==='weighin'?weighin():page==='categories'?categories():page==='brackets'?brackets():settings();$('#app').innerHTML=header()+`<div class="layout"><aside>${nav.map(n=>`<button class="nav ${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('')}<div class="sidefoot">Локальная версия · данные хранятся в этом браузере<br>SETKA PRO · build 1.0</div></aside><main class="main">${body}</main></div>`}
function title(k,t,sub,act=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="muted">${sub}</div></div>${act}</div>`}
function home(){let t=db.tournaments.filter(x=>x.status!=='finished').length,done=db.matches.filter(x=>x.status==='completed').length;return title('Панель управления','Турнирный центр','Управление полным циклом соревнований',`<button class="btn primary" onclick="openTournament()">＋ Новый турнир</button>`)+`<div class="grid stats"><div class="stat"><span>Турниры</span><b>${db.tournaments.length}</b></div><div class="stat"><span>Спортсмены</span><b>${db.athletes.length}</b></div><div class="stat"><span>Заявки</span><b>${db.registrations.length}</b></div><div class="stat"><span>Завершено матчей</span><b>${done}</b></div></div><div class="grid cols"><section class="card"><h3>Ближайшие турниры</h3>${db.tournaments.length?`<div class="tablewrap"><table><thead><tr><th>Турнир</th><th>Дата</th><th>Статус</th><th></th></tr></thead><tbody>${db.tournaments.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,6).map(t=>`<tr><td><b>${esc(t.name)}</b><div class="muted">${esc(t.place||'')}</div></td><td>${esc(t.date||'—')}</td><td><span class="tag ${t.status==='finished'?'green':'amber'}">${statusName(t.status)}</span></td><td><button class="btn small" onclick="selectTournament('${t.id}')">Открыть</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Турниров пока нет. Создайте первый.</div>`}</section><section class="card"><h3>Быстрый запуск</h3><div class="row" style="margin-bottom:10px"><button class="btn primary" onclick="openTournament()">Создать турнир</button><button class="btn" onclick="openAthlete()">Добавить спортсмена</button></div><p class="hint">Порядок работы: турнир → регистрация → взвешивание → категории → сетки → результаты → экспорт.</p><h3 style="margin-top:20px">Состояние системы</h3><p class="muted">Хранилище: <b>локально в браузере</b><br>Режим: автономный файл<br>Пользователь: ${esc(db.user.name)}</p></section></div>`}
function statusName(s){return ({draft:'Черновик',prep:'Подготовка',active:'Идёт',finished:'Завершён'})[s]||s||'—'}
function tournaments(){return title('Соревнования','Турниры','Создавайте соревнования и управляйте их жизненным циклом',`<button class="btn primary" onclick="openTournament()">＋ Создать</button>`)+`<section class="card"><div class="tablewrap"><table><thead><tr><th>Название</th><th>Дата / место</th><th>Статус</th><th>Заявки</th><th>Действия</th></tr></thead><tbody>${db.tournaments.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="muted">${esc(t.organizer||'')}</div></td><td>${esc(t.date||'—')}<div class="muted">${esc(t.place||'')}</div></td><td><span class="tag">${statusName(t.status)}</span></td><td>${db.registrations.filter(r=>r.tournamentId===t.id).length}</td><td class="actions"><button class="btn small" onclick="selectTournament('${t.id}')">Открыть</button><button class="btn small" onclick="editTournament('${t.id}')">Изменить</button><button class="btn small danger" onclick="del('tournaments','${t.id}')">×</button></td></tr>`).join('')||`<tr><td colspan="5" class="empty">Нет турниров</td></tr>`}</tbody></table></div></section>`}
function athletes(){let arr=db.athletes.filter(a=>(a.lastName+' '+a.firstName+' '+a.club).toLowerCase().includes(searchTerm.toLowerCase()));return title('База участников','Спортсмены','Единая база спортсменов и спортивной принадлежности',`<button class="btn primary" onclick="openAthlete()">＋ Спортсмен</button>`)+`<div class="toolbar"><input class="search" placeholder="Поиск по имени, клубу…" value="${esc(searchTerm)}" oninput="searchTerm=this.value;render()"><span class="muted">Всего: ${arr.length}</span></div><section class="card"><div class="tablewrap"><table><thead><tr><th>Спортсмен</th><th>Пол</th><th>Дата рождения</th><th>Клуб</th><th>Город</th><th>Вес</th><th></th></tr></thead><tbody>${arr.map(a=>`<tr><td><b>${esc(a.lastName)} ${esc(a.firstName)}</b></td><td>${a.gender==='female'?'Ж':'М'}</td><td>${esc(a.birth||'—')}</td><td>${esc(a.club||'—')}</td><td>${esc(a.city||'—')}</td><td>${a.weight??'—'} кг</td><td class="actions"><button class="btn small" onclick="editAthlete('${a.id}')">Изменить</button><button class="btn small danger" onclick="del('athletes','${a.id}')">×</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Спортсмены не найдены</td></tr>`}</tbody></table></div></section>`}
function clubs(){return title('Командный состав','Клубы','Клубы, города и принадлежность спортсменов',`<button class="btn primary" onclick="openClub()">＋ Клуб</button>`)+`<section class="card"><div class="tablewrap"><table><thead><tr><th>Клуб</th><th>Город</th><th>Спортсменов в базе</th><th></th></tr></thead><tbody>${db.clubs.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.city||'—')}</td><td>${db.athletes.filter(a=>a.club===c.name).length}</td><td class="actions"><button class="btn small" onclick="editClub('${c.id}')">Изменить</button><button class="btn small danger" onclick="del('clubs','${c.id}')">×</button></td></tr>`).join('')||`<tr><td colspan="4" class="empty">Клубов пока нет</td></tr>`}</tbody></table></div></section>`}
function tournamentOptions(){return db.tournaments.map(t=>`<option value="${t.id}" ${activeTournament===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
function registration(){return title('Допуск к соревнованиям','Регистрация','Заявки спортсменов на турнир и заявленные дисциплины')+`<section class="card"><div class="toolbar"><div class="field"><label>Турнир</label><select onchange="activeTournament=this.value;render()"><option value="">Все турниры</option>${tournamentOptions()}</select></div><button class="btn primary" onclick="openRegistration()">＋ Добавить заявку</button></div><div class="tablewrap"><table><thead><tr><th>Спортсмен</th><th>Турнир</th><th>Рука</th><th>Статус допуска</th><th></th></tr></thead><tbody>${db.registrations.filter(r=>!activeTournament||r.tournamentId===activeTournament).map(r=>{let a=db.athletes.find(x=>x.id===r.athleteId),t=db.tournaments.find(x=>x.id===r.tournamentId);return `<tr><td><b>${a?esc(a.lastName+' '+a.firstName):'Удалённый спортсмен'}</b></td><td>${esc(t?.name||'—')}</td><td>${r.hand==='left'?'Левая':'Правая'}</td><td><span class="tag ${r.status==='approved'?'green':'amber'}">${r.status==='approved'?'Допущен':'На проверке'}</span></td><td class="actions"><button class="btn small" onclick="toggleReg('${r.id}')">${r.status==='approved'?'Снять допуск':'Допустить'}</button><button class="btn small danger" onclick="del('registrations','${r.id}')">×</button></td></tr>`}).join('')||`<tr><td colspan="5" class="empty">Заявок пока нет</td></tr>`}</tbody></table></div></section>`}
function weighin(){return title('Контроль веса','Взвешивание','Фиксация фактического веса, времени и оператора')+`<section class="card"><div class="toolbar"><div class="field"><label>Турнир</label><select onchange="activeTournament=this.value;render()"><option value="">Все турниры</option>${tournamentOptions()}</select></div><button class="btn primary" onclick="openWeighin()">＋ Зафиксировать вес</button></div><div class="tablewrap"><table><thead><tr><th>Спортсмен</th><th>Турнир</th><th>Вес факт.</th><th>Время</th><th>Оператор</th><th>Примечание</th></tr></thead><tbody>${db.weighins.filter(w=>!activeTournament||w.tournamentId===activeTournament).map(w=>{let a=db.athletes.find(x=>x.id===w.athleteId),t=db.tournaments.find(x=>x.id===w.tournamentId);return `<tr><td>${esc(a?.lastName+' '+a?.firstName||'—')}</td><td>${esc(t?.name||'—')}</td><td><b>${w.weight} кг</b></td><td>${esc(w.time||'')}</td><td>${esc(w.operator||'')}</td><td>${esc(w.note||'—')}</td></tr>`}).join('')||`<tr><td colspan="6" class="empty">Нет записей взвешивания</td></tr>`}</tbody></table></div></section>`}
function categories(){return title('Дисциплины','Категории','Весовые, возрастные и ручные параметры категорий',`<button class="btn primary" onclick="openCategory()">＋ Категория</button>`)+`<section class="card"><div class="tablewrap"><table><thead><tr><th>Категория</th><th>Турнир</th><th>Пол</th><th>Весовой лимит</th><th>Рука</th><th>Формат</th><th></th></tr></thead><tbody>${db.categories.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(db.tournaments.find(t=>t.id===c.tournamentId)?.name||'—')}</td><td>${c.gender==='female'?'Женщины':c.gender==='male'?'Мужчины':'Открытая'}</td><td>${c.min??'—'} – ${c.max??'∞'} кг</td><td>${c.hand==='left'?'Левая':c.hand==='right'?'Правая':'Обе'}</td><td>${formatName(c.format)}</td><td class="actions"><button class="btn small" onclick="makeBracket('${c.id}')">Создать сетку</button><button class="btn small danger" onclick="del('categories','${c.id}')">×</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Категории не созданы</td></tr>`}</tbody></table></div></section><p class="hint">Весовые и возрастные границы здесь являются параметрами организатора. Для применения официальных правил федерации загрузите и настройте актуальный регламент.</p>`}
function formatName(f){return ({single:'Олимпийская',double:'Двойное выбывание · черновой формат',rr:'Круговая'})[f]||f}
function brackets(){return title('Спортивная часть','Сетки и результаты','Генерация сеток, фиксация победителей и продвижение по сетке')+`<section class="card"><div class="toolbar"><div class="field"><label>Сетка</label><select id="brSel" onchange="renderBracketView(this.value)"><option value="">Выберите сетку</option>${db.brackets.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><span class="muted">${db.brackets.length} сеток создано</span></div><div id="bracketview" class="empty">Выберите сетку для просмотра результатов.</div></section>`}
function renderBracketView(id){let b=db.brackets.find(x=>x.id===id);let el=$('#bracketview');if(!b){el.innerHTML='Выберите сетку';return}let ms=db.matches.filter(m=>m.bracketId===id);let rounds=[...new Set(ms.map(m=>m.round))].sort((a,b)=>a-b);el.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:15px"><div><b>${esc(b.name)}</b><div class="muted">${formatName(b.format)} · ${ms.length} матчей</div></div><button class="btn small" onclick="exportBracket('${id}')">Экспорт сетки</button></div><div class="bracket">${rounds.map(r=>`<div class="round"><h4>${b.format==='rr'?'ТУР '+r:'РАУНД '+r}</h4>${ms.filter(m=>m.round===r).map(m=>{let a=db.athletes.find(x=>x.id===m.a),bb=db.athletes.find(x=>x.id===m.b);return `<div class="match"><div class="muted" style="font-size:10px">Матч ${m.number}</div><div class="competitor ${m.winner===m.a?'winner':''}"><span>${esc(a? a.lastName+' '+a.firstName:'BYE')}</span><b>${m.sa??''}</b></div><div class="competitor ${m.winner===m.b?'winner':''}"><span>${esc(bb?bb.lastName+' '+bb.firstName:'BYE')}</span><b>${m.sb??''}</b></div>${m.a&&m.b&&m.winner==null?`<button class="btn small" style="width:100%;margin-top:7px" onclick="resultModal('${m.id}')">Внести результат</button>`:''}</div>`}).join('')}</div>`).join('')}</div>`}
function settings(){return title('Конфигурация','Настройки и миграция','Резервное копирование, перенос данных и параметры правил')+`<div class="grid cols"><section class="card"><h3>Профиль соревнований</h3><div class="field"><label>Федерация / организация</label><input id="fed" value="${esc(db.settings.federation)}"></div><div class="field" style="margin-top:12px"><label>Примечание по регламенту</label><textarea id="rules">${esc(db.settings.rulesNote)}</textarea></div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Сохранить настройки</button><div class="divider"></div><h3>Миграция из SETKA 2.0</h3><p class="muted">Загрузите JSON-экспорт из SETKA 2.0. Система перенесёт спортсменов, клубы, турниры, категории, сетки и матчи, где структура данных совместима.</p><input type="file" id="legacy" accept=".json,application/json"><button class="btn" style="margin-top:10px" onclick="importLegacy()">Импортировать JSON SETKA 2.0</button></section><section class="card"><h3>Резервная копия</h3><p class="muted">Полный экспорт базы SETKA PRO в JSON. Храните копию отдельно от устройства.</p><button class="btn primary" onclick="exportAll()">Скачать резервную копию</button><div class="divider"></div><h3>Восстановить данные</h3><input type="file" id="backup" accept=".json,application/json"><button class="btn" style="margin-top:10px" onclick="importBackup()">Восстановить из JSON</button><div class="divider"></div><button class="btn danger" onclick="if(confirm('Удалить все данные SETKA PRO в этом браузере?')){localStorage.removeItem(KEY);location.reload()}">Сбросить локальную базу</button></section></div><p class="hint">Важно: это автономная локальная версия. Выбор роли переключает интерфейсный профиль, но не является защищённой серверной авторизацией. Для нескольких устройств, одновременной работы и настоящего разграничения прав нужна серверная версия с общей базой данных.</p>`}
function modal(title,content,saveText,fn){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="btn small" onclick="closeModal()">✕</button></div>${content}<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="${fn}">${saveText||'Сохранить'}</button></div></div></div>`}function closeModal(){$('#modalroot').innerHTML=''}
function fld(label,id,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}function sel(label,id,opts,val){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${o[0]}" ${val===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
function openTournament(id=''){let t=db.tournaments.find(x=>x.id===id)||{};modal(id?'Изменить турнир':'Новый турнир',`<div class="formgrid">${fld('Название турнира','tn',t.name||'')}${fld('Дата','td',t.date||dateNow(),'date')}${fld('Место проведения','tp',t.place||'')}${fld('Организатор','to',t.organizer||'')}${sel('Статус','ts',[['draft','Черновик'],['prep','Подготовка'],['active','Идёт'],['finished','Завершён']],t.status||'prep')}</div><div class="field" style="margin-top:12px"><label>Описание</label><textarea id="tde">${esc(t.description||'')}</textarea></div>`, 'Сохранить',`saveTournament('${id}')`)}function editTournament(id){openTournament(id)}function saveTournament(id){let x={id:id||uid(),name:$('#tn').value.trim(),date:$('#td').value,place:$('#tp').value,organizer:$('#to').value,status:$('#ts').value,description:$('#tde').value};if(!x.name)return toast('Укажите название турнира');if(id)Object.assign(db.tournaments.find(t=>t.id===id),x);else db.tournaments.push(x);save();closeModal();render();toast('Турнир сохранён')}
function selectTournament(id){activeTournament=id;go('registration')}
function openAthlete(id=''){let a=db.athletes.find(x=>x.id===id)||{};modal(id?'Карточка спортсмена':'Новый спортсмен',`<div class="formgrid">${fld('Фамилия','al',a.lastName||'')}${fld('Имя','af',a.firstName||'')}${sel('Пол','ag',[['male','Мужской'],['female','Женский'],['other','Открытая']],a.gender||'male')}${fld('Дата рождения','ab',a.birth||'','date')}${sel('Клуб','ac',[['','— не выбран —'],...db.clubs.map(c=>[c.name,c.name])],a.club||'')}${fld('Город','acity',a.city||'')}${fld('Вес, кг','aw',a.weight??'','number')}${fld('Страна','country',a.country||'RU')}</div>`, 'Сохранить',`saveAthlete('${id}')`)}function editAthlete(id){openAthlete(id)}function saveAthlete(id){let a={id:id||uid(),lastName:$('#al').value.trim(),firstName:$('#af').value.trim(),gender:$('#ag').value,birth:$('#ab').value,club:$('#ac').value,city:$('#acity').value,weight:$('#aw').value===''?null:Number($('#aw').value),country:$('#country').value};if(!a.lastName||!a.firstName)return toast('Укажите имя и фамилию');if(id)Object.assign(db.athletes.find(x=>x.id===id),a);else db.athletes.push(a);save();closeModal();render();toast('Карточка сохранена')}
function openClub(id=''){let c=db.clubs.find(x=>x.id===id)||{};modal(id?'Изменить клуб':'Новый клуб',`<div class="formgrid">${fld('Название клуба','cn',c.name||'')}${fld('Город','cc',c.city||'')}</div>`,'Сохранить',`saveClub('${id}')`)}function editClub(id){openClub(id)}function saveClub(id){let c={id:id||uid(),name:$('#cn').value.trim(),city:$('#cc').value.trim()};if(!c.name)return toast('Введите название');if(id)Object.assign(db.clubs.find(x=>x.id===id),c);else db.clubs.push(c);save();closeModal();render()}
function openRegistration(){if(!db.tournaments.length||!db.athletes.length)return toast('Сначала создайте турнир и добавьте спортсменов');modal('Регистрация спортсмена',`<div class="formgrid">${sel('Турнир','rt',db.tournaments.map(t=>[t.id,t.name]),activeTournament||db.tournaments[0].id)}${sel('Спортсмен','ra',db.athletes.map(a=>[a.id,a.lastName+' '+a.firstName]),'')}${sel('Рука','rh',[['right','Правая'],['left','Левая'],['both','Обе']], 'right')}${sel('Статус','rs',[['pending','На проверке'],['approved','Допущен']],'pending')}</div>`,'Добавить',`saveRegistration()`)}function saveRegistration(){let x={id:uid(),tournamentId:$('#rt').value,athleteId:$('#ra').value,hand:$('#rh').value,status:$('#rs').value};if(db.registrations.some(r=>r.tournamentId===x.tournamentId&&r.athleteId===x.athleteId&&r.hand===x.hand))return toast('Такая заявка уже существует');db.registrations.push(x);activeTournament=x.tournamentId;save();closeModal();render()}
function openWeighin(){let approved=db.registrations.filter(r=>r.status==='approved');if(!approved.length)return toast('Сначала оформите и допустите заявку');modal('Взвешивание',`<div class="formgrid">${sel('Заявка / спортсмен','wr',approved.map(r=>{let a=db.athletes.find(x=>x.id===r.athleteId);return [r.id,(a?.lastName||'')+' '+(a?.firstName||'')+' · '+(db.tournaments.find(t=>t.id===r.tournamentId)?.name||'')] }), '')}${fld('Фактический вес, кг','ww','','number','step="0.01" min="0"')}${fld('Оператор','wo',db.user.name)}${fld('Примечание','wn','')}</div>`,'Зафиксировать',`saveWeighin()`)}function saveWeighin(){let r=db.registrations.find(x=>x.id===$('#wr').value);let w=Number($('#ww').value);if(!r||!w)return toast('Выберите спортсмена и укажите вес');db.weighins.push({id:uid(),athleteId:r.athleteId,tournamentId:r.tournamentId,weight:w,time:new Date().toLocaleString('ru-RU'),operator:$('#wo').value,note:$('#wn').value});let a=db.athletes.find(x=>x.id===r.athleteId);if(a)a.weight=w;save();closeModal();render();toast('Вес записан')}
function openCategory(){if(!db.tournaments.length)return toast('Сначала создайте турнир');modal('Новая категория',`<div class="formgrid">${sel('Турнир','ct',db.tournaments.map(t=>[t.id,t.name]),activeTournament||db.tournaments[0].id)}${fld('Название','cname','')}${sel('Пол','cg',[['male','Мужчины'],['female','Женщины'],['other','Открытая']],'male')}${fld('Вес от, кг','cmin','','number')}${fld('Вес до, кг','cmax','','number')}${sel('Рука','ch',[['right','Правая'],['left','Левая'],['both','Обе']],'right')}${sel('Формат','cf',[['single','Олимпийская'],['double','Двойное выбывание — черновой формат'],['rr','Круговая']],'single')}</div>`,'Создать',`saveCategory()`)}function saveCategory(){let c={id:uid(),tournamentId:$('#ct').value,name:$('#cname').value.trim(),gender:$('#cg').value,min:$('#cmin').value===''?null:Number($('#cmin').value),max:$('#cmax').value===''?null:Number($('#cmax').value),hand:$('#ch').value,format:$('#cf').value};if(!c.name)return toast('Введите название категории');db.categories.push(c);save();closeModal();render()}
function makeBracket(cid){let c=db.categories.find(x=>x.id===cid);let regs=db.registrations.filter(r=>r.tournamentId===c.tournamentId&&r.status==='approved'&&(c.hand==='both'||r.hand===c.hand));let ids=regs.map(r=>r.athleteId).filter(id=>{let a=db.athletes.find(x=>x.id===id);return a&&(!c.gender||c.gender==='other'||a.gender===c.gender)&&(c.min==null||a.weight>=c.min)&&(c.max==null||a.weight<=c.max)});if(ids.length<2)return toast('В категории нужно минимум два допущенных спортсмена');if(db.brackets.some(b=>b.categoryId===cid))if(!confirm('Сетка уже существует. Создать новую?'))return;let b={id:uid(),categoryId:cid,tournamentId:c.tournamentId,name:c.name,format:c.format,createdAt:Date.now()};db.brackets.push(b);let matches=[];if(c.format==='rr'){let n=1;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)matches.push({id:uid(),bracketId:b.id,round:n++,number:n-1,a:ids[i],b:ids[j],sa:null,sb:null,winner:null,status:'pending'})}else{let size=2**Math.ceil(Math.log2(ids.length)),slots=[...ids];while(slots.length<size)slots.push(null);let rounds=Math.log2(size),prev=[];for(let r=1;r<=rounds;r++){let count=size/2**r,cur=[];for(let i=0;i<count;i++){let m={id:uid(),bracketId:b.id,round:r,number:matches.length+1,a:r===1?slots[i*2]:null,b:r===1?slots[i*2+1]:null,sa:null,sb:null,winner:null,status:'pending',next:null};matches.push(m);cur.push(m)}if(prev.length)prev.forEach((pm,i)=>pm.next=cur[Math.floor(i/2)].id);prev=cur}matches.filter(m=>m.round===1&&(!m.a||!m.b)).forEach(m=>{m.winner=m.a||m.b;m.status='bye';if(m.winner&&m.next){let nx=matches.find(x=>x.id===m.next);if(!nx.a)nx.a=m.winner;else nx.b=m.winner}})}db.matches.push(...matches);save();go('brackets');setTimeout(()=>{let s=$('#brSel');if(s){s.value=b.id;renderBracketView(b.id)}},0);toast('Сетка создана')}
function resultModal(mid){let m=db.matches.find(x=>x.id===mid),a=db.athletes.find(x=>x.id===m.a),b=db.athletes.find(x=>x.id===m.b);modal('Результат матча',`<p>${esc(a?.lastName+' '+a?.firstName)} <b>—</b> ${esc(b?.lastName+' '+b?.firstName)}</p><div class="formgrid">${fld('Счёт спортсмена A','rsa',m.sa??'','number','min="0"')}${fld('Счёт спортсмена B','rsb',m.sb??'','number','min="0"')}</div><p class="muted">Победитель определяется по большему счёту. Правила фолов и формат раундов не автоматизированы. Полная loser bracket / reset final для двойного выбывания ещё не реализована.</p>`,'Сохранить результат',`saveResult('${mid}')`)}function saveResult(id){let m=db.matches.find(x=>x.id===id),a=Number($('#rsa').value),b=Number($('#rsb').value);if($('#rsa').value===''||$('#rsb').value===''||a===b)return toast('Укажите разные итоговые значения');m.sa=a;m.sb=b;m.winner=a>b?m.a:m.b;m.status='completed';if(m.next){let n=db.matches.find(x=>x.id===m.next);if(n){let prev=db.matches.filter(x=>x.next===n.id).sort((x,y)=>x.number-y.number);let slot=prev[0]?.id===m.id?'a':'b';n[slot]=m.winner;}}save();closeModal();renderBracketView(m.bracketId);toast('Результат сохранён')}
function toggleReg(id){let r=db.registrations.find(x=>x.id===id);r.status=r.status==='approved'?'pending':'approved';save();render()}
function del(key,id){if(!can('ADMIN','ORGANIZER','SECRETARY'))return toast('Недостаточно прав в текущем профиле');if(!confirm('Удалить запись?'))return;db[key]=db[key].filter(x=>x.id!==id);save();render()}
function saveSettings(){db.settings.federation=$('#fed').value;db.settings.rulesNote=$('#rules').value;save();toast('Настройки сохранены')}
function download(name,data){let blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportAll(){download('SETKA_PRO_backup_'+dateNow()+'.json',JSON.stringify({format:'SETKA_PRO',version:1,exportedAt:new Date().toISOString(),data:db},null,2));toast('Резервная копия подготовлена')}
function importBackup(){let f=$('#backup').files[0];if(!f)return toast('Выберите JSON-файл');let rd=new FileReader();rd.onload=()=>{try{let j=JSON.parse(rd.result),x=j.data||j;if(!x.athletes||!x.tournaments)throw Error('Неподдерживаемый формат');if(!confirm('Заменить текущую базу импортированными данными?'))return;db={...db,...x};save();render();toast('База восстановлена')}catch(e){toast('Ошибка импорта: '+e.message)}};rd.readAsText(f)}
function importLegacy(){let f=$('#legacy').files[0];if(!f)return toast('Выберите JSON-экспорт SETKA 2.0');let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(x.data)x=x.data;let keys=['athletes','clubs','tournaments','categories','brackets','matches'];let count=0;keys.forEach(k=>{if(Array.isArray(x[k])){let map=new Map(db[k].map(v=>[v.id,v]));x[k].forEach(v=>{if(!map.has(v.id)){db[k].push(v);count++}})}});if(Array.isArray(x.history))db.history=x.history;save();toast('Импорт завершён. Добавлено записей: '+count);render()}catch(e){toast('Не удалось прочитать JSON: '+e.message)}};rd.readAsText(f)}
function exportBracket(id){let b=db.brackets.find(x=>x.id===id);download('SETKA_'+b.name.replace(/[^\wа-яё-]/gi,'_')+'.json',JSON.stringify({bracket:b,matches:db.matches.filter(m=>m.bracketId===id)},null,2))}
function changeRole(role){db.user.role=role;save();render()}
load();render();
</script></body></html>
